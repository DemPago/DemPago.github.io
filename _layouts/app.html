<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Tech Illuminato</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* App layout overrides */
    body[data-layout="app"] .container {
      display: block;
      max-width: 1200px;
      padding: 2rem 1.5rem;
    }
    body[data-layout="app"] .sidebar {
      display: none;
    }
    body[data-layout="app"] .progress-bar {
      display: none;
    }
    .app-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .app-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .app-nav a:hover { color: var(--accent); }
    .app-nav .sep { color: var(--border); }
    .app-nav .current { color: var(--text); font-weight: 600; }
  </style>
  {{ page.head_extra }}
</head>
<body data-layout="app">
  <div class="container">
    <main class="main-content">
      <header>
        <h1><a href="/">Tech Illuminato</a></h1>
        <p>{{ site.description }}</p>
      </header>
      <nav class="app-nav" aria-label="Breadcrumb">
        <a href="/">Home</a>
        <span class="sep">/</span>
        <span class="current">{{ page.title }}</span>
      </nav>
      {{ content }}
    </main>
  </div>
  <footer>
    <div class="brand">⚡ Tech Illuminato Blog</div>
    <p class="copyright">© 2026 DemPago • Made with ☕ and code</p>
  </footer>
  <script src="/main.js"></script>
</body>
</html>
