<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .app-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .app-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .app-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .app-nav a:hover { color: var(--accent); }
    .app-nav .sep { color: var(--border); }
    .app-nav .current { color: var(--text); font-weight: 600; }
    .app-nav .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      margin-right: 0.5rem;
    }
    .app-nav .btn-home:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(88,166,255,0.07);
    }
  </style>
  {{ page.head_extra }}
</head>
<body data-layout="app">
  <div class="app-wrapper">
    <header>
      <h1><a href="/">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
    </header>
    <nav class="app-nav" aria-label="Navigazione">
      <a href="/" class="btn-home">&#8592; Home</a>
      <span class="sep">/</span>
      <span class="current">{{ page.title }}</span>
    </nav>
    {{ content }}
  </div>
  <footer>
    <div class="brand">⚡ {{ site.title }}</div>
    <p class="copyright">© 2026 DemPago • Made with ☕ and code</p>
  </footer>
  <script src="/main.js"></script>
</body>
</html>
