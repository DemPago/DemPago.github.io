<style>
.coin-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.5rem;
  max-width: 480px;
  margin: 0 auto;
  padding-top: 1rem;
}

/* ── Coin stage ─────────────────────────────────────────── */
.coin-stage {
  perspective: 900px;
  width: 220px;
  height: 220px;
  cursor: pointer;
  user-select: none;
}

.coin {
  width: 220px;
  height: 220px;
  position: relative;
  transform-style: preserve-3d;
}

.coin-face {
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

/* Bimetallic: anello esterno argento, disco interno oro */
.coin-testa {
  /* Anello argento esterno */
  background: radial-gradient(circle at 40% 35%,
    #f0f0f0 0%, #d8d8d8 30%, #a8a8a8 50%, #888 65%, #aaa 80%);
  box-shadow:
    inset 0 2px 6px rgba(255,255,255,0.6),
    inset 0 -2px 6px rgba(0,0,0,0.4),
    0 8px 30px rgba(0,0,0,0.6);
}

.coin-croce {
  background: radial-gradient(circle at 60% 35%,
    #f0f0f0 0%, #d8d8d8 30%, #a8a8a8 50%, #888 65%, #aaa 80%);
  box-shadow:
    inset 0 2px 6px rgba(255,255,255,0.6),
    inset 0 -2px 6px rgba(0,0,0,0.4),
    0 8px 30px rgba(0,0,0,0.6);
  transform: rotateY(180deg);
}

/* ── Flip animation ─────────────────────────────────────── */
@keyframes flip-coin {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(var(--flip-end)); }
}
.coin.flipping {
  animation: flip-coin var(--flip-duration) cubic-bezier(0.4,0,0.6,1) forwards;
}

/* ── Button ─────────────────────────────────────────────── */
.coin-btn {
  padding: 0.85rem 2.5rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1.05rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.coin-btn:hover  { opacity: 0.85; }
.coin-btn:active { transform: scale(0.97); }
.coin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── Result ─────────────────────────────────────────────── */
.coin-result {
  font-size: 2rem;
  font-weight: 800;
  min-height: 3rem;
  text-align: center;
  color: #c8a84b;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.coin-result.show { opacity: 1; transform: translateY(0); }

/* ── Stats ──────────────────────────────────────────────── */
.coin-stats {
  display: flex;
  gap: 1.5rem;
  font-size: 0.9rem;
  color: var(--text-muted);
}
.stat-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
.stat-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.stat-value { font-size: 1.35rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

.coin-hint { font-size: 0.8rem; color: var(--text-muted); text-align: center; }
</style>

<script>
let isFlipping    = false;
let totalRotation = 0;
let currentFace   = 'testa';
let stats         = { testa: 0, croce: 0 };

function lancia() {
  if (isFlipping) return;
  isFlipping = true;

  const btn      = document.getElementById('coin-btn');
  const resultEl = document.getElementById('coin-result');
  const coin     = document.getElementById('coin');

  btn.disabled = true;
  resultEl.classList.remove('show');

  const isTesta  = Math.random() < 0.5;
  const giri     = 5 + Math.floor(Math.random() * 4);
  const currentMod = ((totalRotation % 360) + 360) % 360;
  const targetMod  = isTesta ? 0 : 180;
  let delta = targetMod - currentMod;
  if (delta <= 0) delta += 360;
  const endRotation = totalRotation + (giri * 360) + delta;
  const duration    = 1800 + Math.random() * 600;

  coin.style.setProperty('--flip-end',      endRotation + 'deg');
  coin.style.setProperty('--flip-duration', duration    + 'ms');
  coin.style.removeProperty('transform');
  coin.classList.add('flipping');

  setTimeout(() => {
    coin.classList.remove('flipping');
    totalRotation = endRotation;
    coin.style.transform = `rotateY(${endRotation}deg)`;
    currentFace = isTesta ? 'testa' : 'croce';

    stats[currentFace]++;
    document.getElementById('stat-testa').textContent  = stats.testa;
    document.getElementById('stat-croce').textContent  = stats.croce;
    document.getElementById('stat-totale').textContent = stats.testa + stats.croce;

    resultEl.textContent = isTesta ? '🪙 TESTA' : '🌍 CROCE';
    resultEl.className   = 'coin-result show';

    btn.disabled = false;
    isFlipping   = false;
  }, duration);
}
</script>
