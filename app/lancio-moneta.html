/* ── Layout ───────────────────────────────────────────────── */
.coin-app {

/* ── Coin stage ───────────────────────────────────────────── */

}

.coin {

  transition: transform 0.05s linear;
}

/* Faces */
.coin-face {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ── TESTA — lato italiano Dante ────────────────────────── */
.coin-testa {
  background: radial-gradient(circle at 38% 38%, #f5e6a0, #c8a84b 45%, #a07828 70%, #7a5c1e);
  box-shadow:

    inset 0 -3px 8px rgba(0,0,0,0.4),

  border: 3px solid #8a6520;
}

.coin-testa svg {
  width: 130px;
  height: 130px;
  opacity: 0.92;
}

/* ── CROCE — lato europeo ──────────────────────────────── */
.coin-croce {

  box-shadow:
    inset 0 3px 8px rgba(255,255,255,0.35),

  border: 3px solid #8a6520;
}

.coin-croce svg {
  width: 150px;
  height: 150px;
  opacity: 0.92;
}

/* ── Rim ─────────────────────────────────────────────────── */
.coin-rim {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 0 0 6px #9a7230, 0 0 0 7px #c8a84b, 0 0 0 9px #7a5c1e;
  pointer-events: none;
}

/* ── Flip animation ──────────────────────────────────────── */
@keyframes flip-coin {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(var(--flip-end)); }
}

.coin.flipping {
  animation: flip-coin var(--flip-duration) cubic-bezier(0.4, 0.0, 0.6, 1.0) forwards;
}

/* ── Button ──────────────────────────────────────────────── */
.coin-btn {
  padding: 0.85rem 2.5rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1.05rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 0.02em;
}
.coin-btn:hover  { opacity: 0.85; }
.coin-btn:active { transform: scale(0.97); }
.coin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── Result ──────────────────────────────────────────────── */
.coin-result {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  min-height: 3rem;
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.coin-result.show {
  opacity: 1;
  transform: translateY(0);
}
.coin-result.testa { color: #c8a84b; }
.coin-result.croce { color: #c8a84b; }

/* ── Stats ───────────────────────────────────────────────── */
.coin-stats {
  display: flex;
  gap: 1.5rem;
  font-size: 0.9rem;
  color: var(--text-muted);
}
.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
}
.stat-label {
  font-size: 0.72rem;

  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.stat-value {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* ── Hint ────────────────────────────────────────────────── */
.coin-hint {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.5;
}

<script>
let isFlipping = false;
let currentFace = 'testa'; // testa = 0°, croce = 180°
let totalRotation = 0;
let stats = { testa: 0, croce: 0 };

function lancia() {
  if (isFlipping) return;
  isFlipping = true;

  const btn = document.getElementById('coin-btn');
  const resultEl = document.getElementById('coin-result');
  const coin = document.getElementById('coin');

  btn.disabled = true;
  resultEl.classList.remove('show');

  // Decide risultato
  const isTesta = Math.random() < 0.5;

  // Calcola rotazione finale
  // Testa = rotazione pari a multiplo di 360
  // Croce = rotazione pari a multiplo di 360 + 180
  const giri = 5 + Math.floor(Math.random() * 4); // 5-8 giri completi
  const extraGradi = isTesta ? 0 : 180;
  // Normalizza dalla posizione corrente
  const currentMod = totalRotation % 360;
  let targetMod = isTesta ? 0 : 180;
  // Assicura che ruoti sempre in avanti
  let delta = targetMod - currentMod;
  if (delta < 0) delta += 360;
  const endRotation = totalRotation + (giri * 360) + delta;

  const duration = 1800 + Math.random() * 600; // 1.8-2.4s

  coin.style.setProperty('--flip-end', endRotation + 'deg');
  coin.style.setProperty('--flip-duration', duration + 'ms');
  coin.style.removeProperty('transform');
  coin.classList.add('flipping');

  setTimeout(() => {
    coin.classList.remove('flipping');
    totalRotation = endRotation;
    coin.style.transform = `rotateY(${endRotation}deg)`;
    currentFace = isTesta ? 'testa' : 'croce';

    // Aggiorna stats
    stats[currentFace]++;
    document.getElementById('stat-testa').textContent = stats.testa;
    document.getElementById('stat-croce').textContent = stats.croce;
    document.getElementById('stat-totale').textContent = stats.testa + stats.croce;

    // Mostra risultato
    resultEl.textContent = isTesta ? '🪙 TESTA' : '🌍 CROCE';
    resultEl.className = 'coin-result show ' + currentFace;

    btn.disabled = false;
    isFlipping = false;
  }, duration);
}
</script>
